<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: rgba(8, 24, 26, 0.66);
      --ink: #d9fff2;
      --muted: rgba(217, 255, 242, 0.7);
      --line: rgba(135, 255, 220, 0.24);
      --aqua: #41f4c4;
      --mint: #b7ffdc;
      --honey: #ffd36a;
      --ember: #ff7a59;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    html,
    body {
      width: 220px;
      height: 250px;
      overflow: hidden;
      background: transparent;
      font-family: "Noto Sans SC", "Segoe UI", sans-serif;
      user-select: none;
    }

    body {
      -webkit-app-region: drag;
      display: grid;
      place-items: center;
      color: var(--ink);
    }

    .pet-shell {
      position: relative;
      width: 208px;
      height: 238px;
      padding-top: 18px;
      -webkit-app-region: no-drag;
    }

    .drag-handle {
      position: absolute;
      top: 6px;
      left: 48px;
      width: 112px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(65, 244, 196, 0.2), transparent);
      -webkit-app-region: drag;
    }

    .restore-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      z-index: 5;
      width: 34px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 20, 22, 0.72);
      color: var(--mint);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px var(--shadow);
      -webkit-app-region: no-drag;
    }

    .restore-btn:hover {
      border-color: rgba(255, 211, 106, 0.7);
      color: var(--honey);
    }

    .bubble {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 28px;
      z-index: 4;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 18px 18px 18px 6px;
      background:
        radial-gradient(circle at 16% 16%, rgba(255, 211, 106, 0.13), transparent 38%),
        linear-gradient(145deg, rgba(8, 24, 26, 0.92), rgba(3, 12, 13, 0.82));
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .bubble::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: rgba(5, 18, 19, 0.94);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      transform: rotate(45deg);
    }

    .pet-stage {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 154px;
      height: 164px;
      transform: translateX(-50%);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .halo {
      position: absolute;
      inset: 18px 8px 0;
      border-radius: 44% 56% 50% 50%;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 211, 106, 0.24), transparent 28%),
        radial-gradient(circle at 50% 54%, rgba(65, 244, 196, 0.36), transparent 58%);
      filter: blur(16px);
      animation: haloPulse 3.4s ease-in-out infinite;
    }

    .pet {
      position: absolute;
      left: 15px;
      top: 18px;
      width: 124px;
      height: 132px;
      border: 1px solid rgba(183, 255, 220, 0.32);
      border-radius: 44% 56% 48% 52% / 42% 44% 56% 58%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.22), transparent 17%),
        radial-gradient(circle at 72% 78%, rgba(255, 211, 106, 0.32), transparent 22%),
        linear-gradient(145deg, #103235 0%, #0b1e22 48%, #061012 100%);
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.44),
        0 0 26px rgba(65, 244, 196, 0.28),
        inset 0 0 18px rgba(183, 255, 220, 0.08);
      animation: floaty 3s ease-in-out infinite;
    }

    .pet::before,
    .pet::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 30px;
      height: 44px;
      border-radius: 24px 24px 8px 24px;
      background: linear-gradient(150deg, #123f40, #071618);
      border: 1px solid rgba(183, 255, 220, 0.22);
      transform-origin: bottom center;
      z-index: -1;
    }

    .pet::before {
      left: 8px;
      transform: rotate(-30deg);
    }

    .pet::after {
      right: 8px;
      transform: rotate(30deg) scaleX(-1);
    }

    .face {
      position: absolute;
      left: 22px;
      top: 43px;
      width: 80px;
      height: 42px;
    }

    .eye {
      position: absolute;
      top: 0;
      width: 18px;
      height: 24px;
      border-radius: 999px;
      background: var(--mint);
      box-shadow: 0 0 16px rgba(183, 255, 220, 0.7);
      animation: blink 5s infinite;
    }

    .eye.left { left: 8px; }
    .eye.right { right: 8px; }

    .eye::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #052326;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 28px;
      width: 22px;
      height: 10px;
      border-bottom: 3px solid var(--honey);
      border-radius: 0 0 18px 18px;
      transform: translateX(-50%);
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--honey);
      box-shadow: 0 0 14px rgba(255, 211, 106, 0.72);
      opacity: 0.8;
      transform: rotate(45deg);
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .spark.one { left: 22px; top: 28px; }
    .spark.two { right: 16px; top: 58px; animation-delay: 0.8s; }
    .spark.three { left: 36px; bottom: 20px; animation-delay: 1.4s; }

    .paw {
      position: absolute;
      bottom: 18px;
      width: 30px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 211, 106, 0.18);
      border: 1px solid rgba(255, 211, 106, 0.24);
    }

    .paw.left { left: 20px; transform: rotate(12deg); }
    .paw.right { right: 20px; transform: rotate(-12deg); }

    .shadow {
      position: absolute;
      left: 26px;
      bottom: 0;
      width: 104px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.42), transparent 68%);
      animation: shadowBreath 3s ease-in-out infinite;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 13px;
      z-index: 3;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 14, 16, 0.72);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      transform: translateX(-50%);
    }

    .pet-stage.flash .pet {
      animation: excited 560ms ease-in-out 4;
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.44),
        0 0 34px rgba(255, 211, 106, 0.76),
        inset 0 0 24px rgba(255, 211, 106, 0.16);
    }

    [data-mood="sleep"] .eye {
      height: 4px;
      top: 10px;
      background: var(--honey);
      animation: none;
    }

    [data-mood="sleep"] .mouth {
      width: 12px;
      height: 12px;
      border: 2px solid var(--honey);
      border-radius: 50%;
    }

    [data-mood="mischief"] .pet {
      border-radius: 56% 44% 48% 52% / 40% 46% 54% 60%;
    }

    [data-mood="mischief"] .eye.right {
      height: 12px;
      top: 7px;
    }

    [data-mood="spark"] .pet {
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.22), transparent 17%),
        radial-gradient(circle at 76% 72%, rgba(255, 122, 89, 0.32), transparent 24%),
        linear-gradient(145deg, #163935 0%, #102124 48%, #070f12 100%);
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }

    @keyframes shadowBreath {
      0%, 100% { transform: scaleX(0.92); opacity: 0.64; }
      50% { transform: scaleX(1.08); opacity: 0.38; }
    }

    @keyframes haloPulse {
      0%, 100% { opacity: 0.58; transform: scale(0.96); }
      50% { opacity: 0.88; transform: scale(1.06); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.22; transform: rotate(45deg) scale(0.72); }
      50% { opacity: 0.92; transform: rotate(45deg) scale(1.1); }
    }

    @keyframes excited {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-12px) scale(1.05) rotate(-4deg); }
      70% { transform: translateY(-6px) scale(1.02) rotate(4deg); }
    }
  </style>
</head>
<body>
  <main class="pet-shell" id="shell" data-mood="idle">
    <div class="drag-handle" title="Drag me"></div>
    <button class="restore-btn" id="restore" type="button" title="Open OCT">OPEN</button>
    <div class="bubble show" id="bubble">我在。无聊的话，先点我一下。</div>
    <section class="pet-stage" id="petStage" title="Click to poke, double-click to open">
      <div class="halo"></div>
      <div class="spark one"></div>
      <div class="spark two"></div>
      <div class="spark three"></div>
      <div class="pet">
        <div class="face">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>
        <span class="paw left"></span>
        <span class="paw right"></span>
      </div>
      <div class="shadow"></div>
    </section>
    <div class="status" id="status">CODEX PET</div>
  </main>

  <script>
    const { ipcRenderer } = require('electron');

    const shell = document.getElementById('shell');
    const stage = document.getElementById('petStage');
    const bubble = document.getElementById('bubble');
    const status = document.getElementById('status');
    const restore = document.getElementById('restore');

    const moods = ['idle', 'spark', 'mischief', 'sleep'];
    const lines = [
      '我在。今天先把无聊啃掉一小口。',
      '检测到空气中有 73% 的摸鱼离子。',
      '要不要开一个 12 分钟小冲刺？我负责盯着。',
      '点我没用，除非你想被一个小毛球鼓励。',
      '我不是 bug，我是透明窗口里的生物。',
      '把烦的事切成一小块，我们先咬第一口。',
      '如果今天很乱，那就先让桌面上有只会发光的朋友。'
    ];

    let clickTimer = null;
    let lineIndex = 0;
    let bubbleTimer = null;

    function openMainWindow() {
      ipcRenderer.send('float-restore');
    }

    function setMood(mood) {
      shell.dataset.mood = mood;
      status.textContent = mood.toUpperCase();
    }

    function say(text) {
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 4600);
    }

    function poke() {
      const mood = moods[lineIndex % moods.length];
      setMood(mood);
      say(lines[lineIndex % lines.length]);
      lineIndex += 1;
    }

    restore.addEventListener('click', openMainWindow);

    stage.addEventListener('click', () => {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(poke, 180);
    });

    stage.addEventListener('dblclick', () => {
      clearTimeout(clickTimer);
      openMainWindow();
    });

    stage.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      setMood('spark');
      say('收到投喂：一小块注意力饼干。');
    });

    ipcRenderer.on('float-flash', () => {
      setMood('spark');
      say('有新动静！我亮了。');
      stage.classList.add('flash');
      setTimeout(() => stage.classList.remove('flash'), 2300);
    });

    setInterval(() => {
      if (!bubble.classList.contains('show')) {
        setMood('idle');
      }
    }, 9000);
  </script>
</body>
</html>
